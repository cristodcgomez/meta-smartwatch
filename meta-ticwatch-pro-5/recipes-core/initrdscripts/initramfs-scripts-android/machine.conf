# Partition mapping for TicWatch Pro 5 (dace) — VERIFIED via `fastboot getvar all`
# Wear OS 4 / Android 11: dynamic partitions (super) + vendor_boot/init_boot.
#
# Real layout from fastboot (names + sizes):
#   boot:        0x6000000     (96 MB)
#   recovery:    0x4400000     (68 MB)
#   vendor_boot: 0x6000000     (96 MB)
#   init_boot:   0x800000      (8 MB)
#   super:       0x100000000   (4 GB)  <-- contains system, vendor, product (dynamic)
#   userdata:    0x51FFDAE00   (~21.4 GB, f2fs)
#   cache:       0x9E00000     (ext4)
#
# system/vendor live INSIDE super as dynamic logical partitions (like aurora).
# device-mapper maps them as mapper/system, mapper/vendor at boot.
system_partition=mapper/system
vendor_partition=mapper/vendor
# userdata mmc number not exposed by fastboot; confirm via `adb shell cat /proc/partitions`
# or `lsblk` once Android boots. Kept estimated (matches similar Qualcomm eMMC layouts).
sdcard_partition=mmcblk0p38