# Partition mapping for TicWatch Pro 5 (dace)
# Note: These values must be verified with the actual device partition layout
# Common partitions for Wear OS devices:
# - boot: typically mmcblk0p33 or similar
# - recovery: typically mmcblk0p34
# - vendor: typically mmcblk0p37 (for Android <=10) or via vendor_boot for Android 11+
# - userdata: typically mmcblk0p38 or higher

# For Android 11+, vendor files may be in vendor_boot or super partition
# Adjust these based on actual /proc/partitions or fastboot getvar all output
boot_partition=mmcblk0p33
recovery_partition=mmcblk0p34
vendor_partition=mmcblk0p37
userdata_partition=mmcblk0p38
