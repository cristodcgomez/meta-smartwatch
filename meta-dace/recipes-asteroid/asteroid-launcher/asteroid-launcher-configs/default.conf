EGL_PLATFORM=hwcomposer
QT_QPA_PLATFORM=hwcomposer
# El T5 (Wear OS, Qualcomm) NO tiene modulo hwcomposer passthrough: en A13 el
# composer es un SERVICIO. Sin esta variable el plugin QPA llama a
# hw_get_module("hwcomposer") y el launcher se queda colgado abierto el modulo
# (nunca llega a crear el display Wayland). Con QT_QPA_FORCE_HWC2=1 el plugin
# usa directamente el backend HWC2 (que habla con el servicio composer) y
# funciona: verificado en el reloj -> aparece /run/user/1000/wayland-0 y el
# CRTC card0-DSI-1 pasa a 'enabled' (la UI se pinta).
QT_QPA_FORCE_HWC2=1

LIPSTICK_OPTIONS="-plugin evdevtouch:/dev/input/event3 -plugin evdevmouse:/dev/input/event2 -plugin evdevkeyboard:/dev/input/event2 -plugin evdevkeyboard:/dev/input/event0:keymap=/usr/share/qt5/keymaps/keys.qmap"
# evdevmouse sobre event2: el bridge del slate reporta la CORONA como REL_WHEEL
# en ese input (EV_KEY|EV_REL). evdevkeyboard solo consume EV_KEY, asi que la
# rueda se perdia. evdevmouse (plugin generico de Qt; mismo patron que
# hoki/narwhal/ray) convierte REL_WHEEL en QWheelEvent, que lipstick reenvia
# (LipstickCompositorWindow::wheelEvent) y el launcher consume en su
# WheelHandler (005-speed-dial.qml). Ninguno de los dos hace EVIOCGRAB, por eso
# pueden leer el MISMO event2 a la vez.
# OJO al mapeo de events (determinista, ver AGENTS.md §5/§6):
#   event0 = gpio-keys (boton lateral) · event1 = qpnp_pon
#   event2 = slate-spi (bridge del vendor; REL_WHEEL de la corona + teclas)
#   event3 = zinitix_ts (táctil, driver del vendor cargado en dace-lxc-hal-start.sh)
# El bridge del vendor se carga ANTES que zinitix (zinitix necesita sus
# simbolos), por eso el tactil cae en event3 y la corona en event2.
QT_ENABLE_GLYPH_CACHE_WORKAROUND=true
QT_IM_MODULE=qtvirtualkeyboard

# OJO: /vendor/lib/egl es IMPRESCINDIBLE -- los subdrivers EGL
# (eglSubDriverAndroid.so) viven ahi, no en /vendor/lib. Sin esa ruta el
# launcher escupia 'library "eglSubDriverAndroid.so" not found' y el compositor
# no llegaba a crear el display Wayland (unidad en 'activating' hasta el
# timeout de 90 s). Verificado en el reloj: con la ruta, el error desaparece.
#
# Point libhybris's Android linker at this device's Android-13 /system libs
# (LXC container rootfs), the A13 vendor (/vendor -> /android/vendor), the
# pie64 hal-droid tree (where libui_compat_layer.so lives), and the runtime
# apex bionic dir (for libdl_android.so, a dangling /apex symlink in
# /system/lib).
HYBRIS_LD_LIBRARY_PATH=/var/lib/lxc/android/rootfs/system/lib:/vendor/lib:/vendor/lib/egl:/usr/libexec/hal-droid/system/lib:/var/lib/lxc/android/rootfs/apex/com.android.runtime/lib/bionic

# Strip UBWC-triggering bits (HW_COMPOSER, PRIVATE_ALLOC_UBWC,
# PRIVATE_ALLOC_UBWC_PI) from HWComposerNativeWindow's buffer usage so the
# allocator returns linear (modifier=0) buffers. Monaco's only
# launcher-eligible SDE plane is plane 70 (DMA pipe), which can't scan UBWC;
# without this, drmModeAtomicCommit fails -EINVAL and the launcher loops on
# `prepare: validate failed`. Read by the dace-only libhybris patch
# (libhybris-dace-disable-ubwc-usage).
HYBRIS_HWC_DISABLE_COMPOSER_USAGE=1
