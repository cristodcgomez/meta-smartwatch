# AI Assisted:
#@TYPE: Machine
#@NAME: TicWatch Pro 5
#@DESCRIPTION: Machine configuration for the TicWatch Pro 5 (dace/monaco) platform

# armv7 userspace (hybris), arm64 GKI kernel (bootloader UEFI requires ARM64).
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
DEFAULTTUNE = "armv7vehf-neon"
require conf/machine/include/hybris-watch.inc

MACHINE_DISPLAY_ROUND = "true"
MACHINE_HAS_WLAN = "true"
MACHINE_HAS_SPEAKER = "true"
# Wear OS 4 (Android 13): ARM64 Qualcomm monaco 5.15.144 kernel (google-eos, like aurora)
PREFERRED_PROVIDER_virtual/android-system-image = "android"
# pie64 (not pie32): the layer bbappend is android_armv7-pie64.bbappend and the
# container Android is A13 (API 33). With pie32 the bbappend does not apply.
PREFERRED_VERSION_android = "armv7+pie64"

# Meta-aurora defines it; without this the image picks android-tools-conf *plain*
# (as happened in the 5-sep rootfs) and the dace drop-in
# 99-dace-no-configfs.conf is NOT installed -> android-gadget-setup adb competes
# with init_gfs and usb-moded, and adb mode falls back to a broken mass-storage
# (18d1:0afe, LUN 0B).
# ── LIBHYBRIS: MAKE SURE THE 'q' LINKER IS BUILT (THE ONLY ONE WITH RELR) ───
# hybris-watch.inc sets PREFERRED_PROVIDER_virtual/android-headers = "android",
# which resolves to the 'android' recipe with Android 9 headers. That makes the
# libhybris configure read "Android headers version is 9.0.0" and, since the
# linkers are built per version
#   if HAS_ANDROID_7_0_0 -> n     if HAS_ANDROID_8_0_0 -> o
#   if HAS_ANDROID_10_0_0 -> q    <- ONLY q supports DT_RELR
# the 'q' linker is NOT built: only jb/mm/n/o come out.
#
# Real consequence (caught on the watch): the bionic libs of the container's
# Android 13 (libc++.so, libutils.so, libbase.so, libcutils.so...) carry
# DT_RELR (0x23/0x24/0x25) and the linker ignored them ("unused DT entry"), so
# the GOT slots kept the raw ADDEND (an offset inside the lib,
# e.g. 0x485d4) -> the first jump through it died: asteroid-launcher SIGILL,
# getprop/sensorfwd SIGSEGV, ALL with pc=0x485d4.
#
# With 11.0 headers q.so is built (which does carry RELR: common/q/hybris_compat.h)
# and the launcher stops jumping to garbage. It is EXACTLY the same pair of lines
# that meta-aurora has (and that dace.conf was missing, just like it was missing
# the IMAGE_INSTALL ones).
PREFERRED_PROVIDER_virtual/android-headers = "android-headers-halium"
PREFERRED_VERSION_android-headers-halium = "11.0"

PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-configfs"

PREFERRED_PROVIDER_virtual/kernel = "linux-dace"
PREFERRED_VERSION_linux-dace = "5.15.144+git%"
# The kernel is aarch64 while userspace is armv7 (like aurora)
TUNE_PKGARCH:pn-linux-dace = "aarch64"

# ---------------------------------------------------------------------------
# Android/UI stack: LXC Halium-13 container (EXACT aurora pattern, which is the
# Pixel Watch 2: same monaco/SW5100 SoC and same panel). Without this the
# launcher aborts with "failed to find/load gralloc" because there is no Android
# side.
#
#   dace-vendor-mount       dm-linear of super + /android/* + /vendor /system symlinks
#   lxc + dace-lxc-android  container with the Halium-13 rootfs (android-rootfs.img)
#   dace-libui-compat-layer libui_compat_layer.so (libhybris gralloc4; without it,
#                           hw_get_module('gralloc') falls back to the software stub and SIGSEGVs)
#   dace-modules-autoload   WLAN/ASoC/BT modules that only exist after the rootfs
#
# android-init/android-system are REMOVED (like aurora): the Android userspace
# runs INSIDE the container, and /system on the host must point to the container's
# system (created by dace-vendor-mount), not to the hal-droid tree.
# ---------------------------------------------------------------------------
IMAGE_INSTALL:remove = "android-init android-system nfcd"
IMAGE_INSTALL += "dace-vendor-mount dace-lxc-android dace-libui-compat-layer dace-modules-autoload dace-vendor-touch dace-bt-firmware dace-bt-attach"
# droidmedia provides libminisf.so (the mini-SurfaceFlinger) that the hwcomposer
# QPA plugin backend needs (hwcomposer_backend_v20.h receives a
# 'void *libminisf'). Without it, the launcher warns:
#   library "libminisf.so" not found
#   libminisf is incompatible or missing. Can not possibly start the
#   SurfaceFlinger service. ... (and/or this plugin)
# and hangs before creating the Wayland display (the unit stays in
# 'activating' until the 90 s timeout). Note: the recipe exists in
# meta-asteroid but was NOT in IMAGE_INSTALL (same pattern as the rest of the
# UI stack).
IMAGE_INSTALL += "droidmedia"
# mce-plugin-libhybris: the CORRECT HAL path for BRIGHTNESS on a Wear OS watch.
# On the T5 brightness does NOT depend on the kernel backlight (the panel DT does
# not declare qcom,mdss-dsi-bl-pmic-control-type, and msm_drm creates a 'raw'
# backlight at /sys/class/backlight/panel0-backlight whose actual_brightness
# stays at 0): it is managed by the Qualcomm display HAL (the container composer
# service, which exposes getDisplayBrightness/SetDisplayBrightnessScale).
# The display.so module of mce writes the kernel backlight -> useless here.
# This plugin gives mce a libhybris backend to talk to the HAL.
# (The alternative was to hand-add the bl-* properties to the panel DT,
#  but that is a kernel patch; this is what an acceptable port does.)
# mce-plugin-libhybris: DISCARDED -- its sources are sysfs-led-binary.c /
# sysfs-led-bacon.c, i.e. it is about LEDs, not screen brightness. Brightness
# goes through the kernel DCS backlight (the dtbo declares it like aurora) + mce.
# The bbappend that fixes its DEPENDS is kept, but it is not installed.
# IMAGE_INSTALL += "mce-plugin-libhybris"
IMAGE_INSTALL += "lxc"
# Qt shader cache in RAM: if the rootfs fills up, Qt cannot write the cache and
# the compositor starts up painting BLACK.
IMAGE_INSTALL += "dace-cache-tmpfs dace-powerlog dace-usb-icl"

# ── WLAN: regulatory database (aurora ships it) ─────────────────────────────
# qcacld reads /lib/firmware/regulatory.db at cfg80211 init; without it, the
# domain stays in world-roaming and most channels come out inactive
# (scanning and connections "do not work well"). wireless-regdb-static
# installs the upstream database without needing CRDA. It is exactly what
# meta-aurora/conf/machine/aurora.conf adds.
IMAGE_INSTALL += "wireless-regdb-static"

IMAGE_INSTALL += "sensorfw-hybris-hal-plugins util-linux-rfkill underclock udev-droid-system bluebinder"
# ── Phone synchronization (BLE) ─────────────────────────────────────────────
# WITHOUT this the watch is NOT pairable with the phone: AsteroidOS does not use
# classic BT pairing, it uses the phone's "AsteroidOS Sync" app against this
# daemon (BLE GATT server) on the watch. When not installed, the watch does not
# advertise over BLE and no app finds it (the HCI/controller may be perfectly up:
# hci0 UP RUNNING with its BD Address).
# It is a USER service (/usr/lib/systemd/user/, runs as ceres) that already has
# its deps in the image (qml-asteroid, mlite, amber-mpris, launcher).
IMAGE_INSTALL += "asteroid-btsyncd"

# The rootfs must contain android-rootfs.img (268 MB, the container's Android-13
# system) + margin for the journal and the container logs. With the default extra
# (64 MB) the image ended up at 97% with only 22 MB free. 512 MB of extra
# -> ~1.4 GB image.
# 512 MB was tight: with the persistent journal (~48 MB) the rootfs reached 100%
# at runtime and that broke Qt rendering. 1 GB of extra.
# NOTE: IMAGE_ROOTFS_EXTRA_SPACE was not being applied to the image (it stayed at
# 1.3 GB with 2.5 MB free). IMAGE_ROOTFS_SIZE (minimum in KB) is also set, and on
# rebuild it is worth doing: bitbake -c cleansstate asteroid-image
IMAGE_ROOTFS_SIZE = "2000000"
IMAGE_ROOTFS_EXTRA_SPACE = "1048576"
