#@TYPE: Machine
#@NAME: TicWatch Pro 5
#@DESCRIPTION: Machine configuration for the TicWatch Pro 5 (dace/monaco) platform

# Userspace armv7 (hybris), kernel arm64 GKI (bootloader UEFI exige ARM64).
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
DEFAULTTUNE = "armv7vehf-neon"
require conf/machine/include/hybris-watch.inc

MACHINE_DISPLAY_ROUND = "true"
MACHINE_HAS_WLAN = "true"
MACHINE_HAS_SPEAKER = "true"
# Wear OS 4 (Android 13): kernel ARM64 Qualcomm monaco 5.15.144 (google-eos, como aurora)
PREFERRED_PROVIDER_virtual/android-system-image = "android"
# pie64 (no pie32): el bbappend de la capa es android_armv7-pie64.bbappend y el
# androide del contenedor es A13 (API 33). Con pie32 el bbappend no aplica.
PREFERRED_VERSION_android = "armv7+pie64"

# Meta-aurora lo define; sin esto la imagen coge android-tools-conf *plain*
# (como paso en el rootfs del 5-sep) y NO se instala el drop-in dace
# 99-dace-no-configfs.conf -> android-gadget-setup adb compite con init_gfs y
# usb-moded y el modo adb cae a un mass-storage roto (18d1:0afe, LUN 0B).
# ── LIBHYBRIS: QUE SE CONSTRUYA EL LINKER 'q' (EL ÚNICO CON RELR) ───────────
# hybris-watch.inc pone PREFERRED_PROVIDER_virtual/android-headers = "android",
# que resuelve al recipe 'android' con headers de Android 9. Eso hace que en el
# configure de libhybris se lea "Android headers version is 9.0.0" y, como los
# linkers se compilan por version
#   if HAS_ANDROID_7_0_0 -> n     if HAS_ANDROID_8_0_0 -> o
#   if HAS_ANDROID_10_0_0 -> q    <- SOLO el q soporta DT_RELR
# el linker 'q' NO se compila: solo salen jb/mm/n/o.
#
# Consecuencia real (cazada en el reloj): las libs bionic de Android 13 del
# contenedor (libc++.so, libutils.so, libbase.so, libcutils.so...) llevan
# DT_RELR (0x23/0x24/0x25) y el linker las ignoraba ("unused DT entry"), así que
# los slots GOT se quedaban con el ADDEND crudo (un offset dentro de la lib,
# p.ej. 0x485d4) -> el primer salto por ahí moría: asteroid-launcher SIGILL,
# getprop/sensorfwd SIGSEGV, TODOS con pc=0x485d4.
#
# Con headers 11.0 se compila q.so (que sí trae RELR: common/q/hybris_compat.h)
# y el launcher deja de saltar a basura. Es EXACTAMENTE el mismo par de líneas
# que tiene meta-aurora (y que a dace.conf le faltaban, como le faltaban las de
# IMAGE_INSTALL).
PREFERRED_PROVIDER_virtual/android-headers = "android-headers-halium"
PREFERRED_VERSION_android-headers-halium = "11.0"

PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-configfs"

PREFERRED_PROVIDER_virtual/kernel = "linux-dace"
PREFERRED_VERSION_linux-dace = "5.15.144+git%"
# El kernel es aarch64 mientras el userspace es armv7 (como aurora)
TUNE_PKGARCH:pn-linux-dace = "aarch64"

# ---------------------------------------------------------------------------
# Pila Android/UI: contenedor LXC Halium-13 (patron EXACTO de aurora, que es
# el Pixel Watch 2: mismo SoC monaco/SW5100 y mismo panel). Sin esto el
# launcher aborta con "failed to find/load gralloc" porque no hay lado Android.
#
#   dace-vendor-mount       dm-lineal de super + /android/* + symlinks /vendor /system
#   lxc + dace-lxc-android  contenedor con el rootfs Halium-13 (android-rootfs.img)
#   dace-libui-compat-layer libui_compat_layer.so (gralloc4 de libhybris; sin el,
#                           hw_get_module('gralloc') cae al stub software y SIGSEGV)
#   dace-modules-autoload   WLAN/ASoC/BT modules que solo existen tras el rootfs
#
# android-init/android-system se QUITAN (como aurora): el Android userspace
# corre DENTRO del contenedor, y /system en el host debe apuntar al system del
# contenedor (lo crea dace-vendor-mount), no al arbol hal-droid.
# ---------------------------------------------------------------------------
IMAGE_INSTALL:remove = "android-init android-system nfcd"
IMAGE_INSTALL += "dace-vendor-mount dace-lxc-android dace-libui-compat-layer dace-modules-autoload"
IMAGE_INSTALL += "lxc"

IMAGE_INSTALL += "sensorfw-hybris-hal-plugins util-linux-rfkill underclock udev-droid-system bluebinder"

# El rootfs tiene que llevar DENTRO android-rootfs.img (268 MB, el sistema
# Android-13 del contenedor LXC) + margen para el journal y los logs del
# contenedor. Con el extra por defecto (64 MB) la imagen quedaba al 97% con
# solo 22 MB libres. 512 MB de extra -> ~1,4 GB de imagen.
IMAGE_ROOTFS_EXTRA_SPACE = "524288"