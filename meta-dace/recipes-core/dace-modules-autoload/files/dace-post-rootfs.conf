# Modulos cuyos .ko viven en el rootfs (/lib/modules/<KREL>/vendor/) y que por
# tanto NO pueden ir en el initramfs (modules.load.dace): systemd los carga
# aqui, despues del switch_root.
#
# ⚠️ DESACTIVADO A PROPOSITO (13-09-2026). La cadena de abajo tumba el SoC a
# EDL a los ~10 s del arranque del rootfs (la ultima linea de consola era del
# crypto engine, qcedev_probe_device). Se descubrio que el disparador NO es
# este fichero (systemd-modules-load) sino que **udev los carga por modalias en
# su coldplug**, por eso vaciar este fichero no evitaba el crash. Ahora estan
# todos en /etc/modprobe.d/00-dace-vendor-blacklist.conf (eso bloquea a udev).
#
# OJO con la interaccion: 'blacklist' SOLO ignora los alias internos del
# modulo, asi que `modprobe <modulo>` explicito (lo que hace
# systemd-modules-load con las lineas de aqui abajo) SI lo carga. Por eso, hasta
# identificar el modulo culpable, esta lista tiene que quedar comentada:
# descomentar lineas es precisamente como se biseca.
#
# --- WLAN (qcacld-3.0 + CNSS platform glue) ---
# wlan.ko es el driver qcacld. icnss2 es el subsistema cnss que negocia el
# WLFW QMI con el firmware del modem. Los cnss_* son utilidades.
#wlan
#icnss2
#cnss_nl
#cnss_plat_ipc_qmi_svc
#cnss_prealloc
#cnss_utils
#wlan_firmware_service
#google_wlan_mac
#
# --- ASoC machine driver + codecs ---
# machine_dlkm es monaco-asoc-snd. Arrastra bolero/wcd/wsa/macros/swr por deps.
