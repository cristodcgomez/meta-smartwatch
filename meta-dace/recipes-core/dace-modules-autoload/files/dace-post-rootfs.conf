# Modulos cuyos .ko viven en el rootfs (/lib/modules/<KREL>/vendor/) y que por
# tanto NO pueden ir en el initramfs (modules.load.dace): systemd los carga
# aqui, despues del switch_root.
#
# HISTORIA: esta lista estuvo comentada desde el 13-09-2026 porque la cadena
# tumbaba el SoC a EDL a los ~10 s. Se descubrio que el culpable NO era
# systemd-modules-load sino **udev**, que cargaba los .ko por modalias en su
# coldplug; por eso ahora estan todos en
# /etc/modprobe.d/00-dace-vendor-blacklist.conf (eso bloquea a udev). Con el
# blacklist puesto la lista se puede activar: el `modprobe` explicito de
# systemd-modules-load SI carga el modulo (blacklist solo ignora los alias).
#
# ✅ PROBADO EN VIVO (18-09-2026): la cadena WLAN entera carga SIN crashear:
#     cnss_plat: CNSS Platform IPC QMI Service is started
#     icnss2 c800000.qcom,icnss: Platform driver probed successfully
#     wlan: Loading driver v2.0.9.17Y ... wlan_hdd_state wlan major(491) initialized
# OJO: `google_wlan_mac` falla con "Unable to locate /chosen/config in
# device-tree": el bootloader de Google rellena /chosen/config con la MAC
# provisionada (propiedad `wlan_mac1`) y el ABL de Mobvoi NO lo hace -> sin ese
# nodo qca_cld3_wlan se queda sin MAC y no aparece wlan0. Ver AGENTS §7ter.

