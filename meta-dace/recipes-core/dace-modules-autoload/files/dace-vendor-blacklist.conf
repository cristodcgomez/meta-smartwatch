# dace: los modulos vendor (.ko en /lib/modules/<krel>/vendor/) los carga udev
# por modalias en el coldplug a los ~10.6 s del arranque del rootfs y el SoC
# resetea a EDL justo despues (la ultima linea de consola era del crypto
# engine). El rootfs viejo NO los tenia (vendor/ vacio: linux-dace-modules no
# estaba instalado) y aguantaba horas sin problema. Hasta identificar cual es
# el culpable se bloquean todos: 'blacklist' solo afecta al autoload por alias,
# asi que se puede seguir cargando a mano lo necesario con modprobe.
#
# Generado con:
#   for f in /lib/modules/*/vendor/*.ko; do echo "blacklist $(basename $f .ko)"; done
# (76 modulos; el retirar lineas de aqui es la forma de bisecar el culpable.)
