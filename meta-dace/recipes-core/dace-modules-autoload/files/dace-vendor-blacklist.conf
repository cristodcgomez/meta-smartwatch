# El tactil del T5 (Zinitix) SI funciona, pero se carga APARTE y DESPUES de los
# HAL del display: con el driver built-in (o cargado por udev en el coldplug a
# los ~10 s) el composer-service de Qualcomm muere con SIGSEGV (~0.2 s tras
# arrancar, justo tras crear /dev/socket/pps) y la UI se queda sin composer.
# dace-lxc-hal-start.sh hace 'modprobe zinitix' despues de arrancar
# allocator+composer. 'blacklist' solo afecta al autoload por alias: el modprobe
# explicito sigue funcionando.
blacklist zinitix
