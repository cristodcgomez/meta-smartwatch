# Particiones del eMMC del TicWatch Pro 5 (mapa real by-name, del uevent sysfs):
#   mmcblk0p7  = super (Wear OS dynamic)
#   mmcblk0p56 = swap
#   mmcblk0p62 = userdata (F2FS, 20 GiB) <- el rootfs de AsteroidOS vive aquí
#   (/sdcard/asteroidos.ext4, push por adb; el init lo monta loop y switch_root)
sdcard_partition=mmcblk0p62
sdcard_fstype=f2fs
system_partition=mapper/system
